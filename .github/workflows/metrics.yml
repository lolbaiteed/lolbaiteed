name: GitHub Metrics

on:
  # Run every day at 00:15 UTC.
  schedule:
    - cron: "15 0 * * *"
  # Allow a manual run from the Actions tab.
  workflow_dispatch:
  # Refresh after changes to this workflow.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lolbaiteed
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Almaty
          config_display: large
          config_output: svg
          filename: assets/metrics.svg

          # Gruvbox-inspired palette.
          config_twemoji: false
          config_animations: false

          # Plugin selection.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7
          plugin_languages_categories: programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_visibility: all
          plugin_activity_timestamps: true

          plugin_repositories: yes
          plugin_repositories_featured: ProofBase, load-balancer, antigravity.nvim, gowave, C
          plugin_repositories_order: featured, pinned
          plugin_repositories_pinned: 5

          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
