<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>09- Task</title>
    <script src="js/tailwindcss-3.4.4.js"></script>
    <link rel="stylesheet" href="css/daisyui.min.css">
</head>
<body class="min-h-[100vh] flex justify-center items-center bg-slate-400">
    <main>
        <h1 class="text-slate-800 text-3xl text-center p-4 underline underline-offset-4">09- Task</h1>
        <div class="artboard phone-1 bg-slate-300 rounded-md p-4">
                <table class="table bg-slate-800 text-slate-400">
                    <tr>
                        <th>Input</th>
                        <th>Output</th>
                    </tr>
                    <tr>
                      <th>[1, 2, 9, 6, 8]</th>
                      <td>9</td>
                    </tr>
                </table>
        </div>
    </main>
    <script>
        // Work Here
          let firstMax;
          let SecondMax;
          const table = document.querySelector('table.table');
          const array = table.rows[1].cells[0]; 
          let jsonArr = JSON.parse(array.textContent)
          const output = table.rows[1].cells[1];
          for (let i = 1; i < 3; i++) {
            if(i === 1) {
              firstMax = Math.max(...jsonArr); 
              jsonArr.splice(jsonArr.indexOf(firstMax), 1);
            }
            SecondMax = Math.max(...jsonArr);
          }
          let result = SecondMax + firstMax;
          output.innerHTML = result;
    </script>
</body>
</html>
